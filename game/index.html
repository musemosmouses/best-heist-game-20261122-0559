<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gilded Vault — a heist game</title>
<meta name="description" content="Rook slips into the Meridian Gallery after hours: dodge guard patrols and sweeping cameras, lift the Sunspire Diamond, and reach the service exit before the alarm hits 100.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1210; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="The Gilded Vault: sneak Rook across the Meridian Gallery, steal the Sunspire Diamond, and reach the service exit without tripping the alarm"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
